<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #faf7f2;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="55"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-00-intro"
        class="scene"
        data-composition-id="00-intro"
        data-composition-src="compositions/frames/00-intro.html"
        data-start="0"
        data-duration="4.4"
        data-track-index="0"
      ></div>
      <audio
        id="el-00-intro-voice"
        src="assets/voice/01.wav"
        data-start="0"
        data-duration="4"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-00-intro", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.4, ease: "power2.inOut" }, 4);
        tl.fromTo("#el-01-hook", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.4, ease: "power2.inOut" }, 4);
        tl.to("#el-01-hook", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.35, ease: "power2.inOut" }, 10);
        tl.fromTo("#el-02-identity", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.35, ease: "power2.inOut" }, 10);
        tl.to("#el-02-identity", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 17);
        tl.fromTo("#el-03-reveal", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 17);
        tl.to("#el-03-reveal", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.35, ease: "power2.inOut" }, 22);
        tl.fromTo("#el-05-usecases", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.35, ease: "power2.inOut" }, 22);
        tl.to("#el-05-usecases", { x: -1920, duration: 0.4, ease: "power3.inOut" }, 38);
        tl.fromTo("#el-05-trust", { x: 1920, opacity: 1 }, { x: 0, duration: 0.4, ease: "power3.inOut" }, 38);
        tl.to("#el-05-trust", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 45);
        tl.fromTo("#el-06-close", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 45);
        tl.to("#el-06-close", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.5, ease: "power3.in" }, 51);
        tl.fromTo("#el-07-brand", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 51);
        tl.to({}, { duration: 55 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
